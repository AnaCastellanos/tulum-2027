<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulum 2027 ✦ Raves</title><meta property="og:title" content="Tulum 2027 ✦ Raves"><meta property="og:description" content="Zamna, 1 al 11 de enero">
<style>
body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0,#5b2a86,#1a0b2e 60%,#0c0616) fixed;font-family:-apple-system,Helvetica,sans-serif;color:#fff}
main{max-width:640px;margin:0 auto;padding:36px 10px}
h1{font-size:clamp(30px,9vw,42px);margin:0;letter-spacing:6px;font-weight:800}.sub{color:#c9a7f0;letter-spacing:3px;font-size:14px;margin:6px 0 24px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.h{text-align:center;color:#c9a7f0;font-size:11px;letter-spacing:1px;padding-bottom:4px}
.c{min-height:96px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(201,167,240,.18);padding:5px 3px;box-sizing:border-box;overflow:hidden}
.off{opacity:.15}.num{font-size:14px;color:#c9a7f0;font-weight:600}
.ev{background:linear-gradient(160deg,rgba(155,89,230,.55),rgba(80,30,130,.5));border-color:#c9a7f0}.ev .num{color:#fff}
.n{font-size:clamp(8px,2.2vw,13px);letter-spacing:-.3px;font-weight:700;margin-top:6px;line-height:1.15;overflow-wrap:normal;word-break:keep-all}.t{font-size:11px;color:#e6d6fa;margin-top:3px}
.tag{display:inline-block;text-align:center;line-height:1.1;font-size:clamp(7px,1.9vw,9px);border:1px solid #f0c36b;color:#f0c36b;border-radius:99px;padding:1px 4px;margin-top:4px}
.ev{cursor:pointer}.bx{margin-top:22px;background:rgba(255,255,255,.06);border:1px solid rgba(201,167,240,.18);border-radius:12px;padding:14px}
.bx h2{margin:0 0 10px;font-size:16px;letter-spacing:3px;color:#c9a7f0}.r{padding:9px 0;border-top:1px solid rgba(201,167,240,.12)}.r label{display:flex;gap:10px;align-items:center;font-weight:700}
.r input{width:20px;height:20px;accent-color:#9b59e6}.r small{color:#c9a7f0;font-weight:400}.w{font-size:12px;color:#e6d6fa;margin:4px 0 0 30px}.d{font-size:12px;color:#f0c36b;margin-left:auto;background:none;border:0;padding:4px}
.in{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #c9a7f0;background:rgba(0,0,0,.25);color:#fff;font-size:16px;margin-bottom:6px}
.bt{width:100%;margin-top:12px;padding:12px;border:0;border-radius:99px;background:#f0c36b;color:#1a0b2e;font-weight:800;font-size:15px;letter-spacing:1px}.ok{text-align:center;color:#f0c36b;margin-top:10px}
#m{position:fixed;inset:0;background:rgba(12,6,22,.8);display:none;align-items:flex-end;justify-content:center}#m.s{display:flex}#m>div{background:#2a1245;border:1px solid #c9a7f0;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:640px;box-sizing:border-box}#m p{margin:8px 0;color:#e6d6fa}#m a{color:#f0c36b}
.f{margin-top:24px;color:#a98cc8;font-size:13px;text-align:center;letter-spacing:1px}
.ch{display:flex;flex-wrap:wrap;gap:8px}.ch button{flex:1 1 30%;padding:14px 6px;border-radius:99px;border:1px solid #c9a7f0;background:rgba(155,89,230,.25);color:#fff;font-size:16px;font-weight:700}.me{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700}.me a{color:#f0c36b;font-size:13px;font-weight:400}.q{color:#e6d6fa;margin:0 0 10px}
.pp{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}.pp span{font-size:9px;font-weight:800;line-height:14px;min-width:14px;padding:0 2px;box-sizing:border-box;text-align:center;border-radius:99px;background:#f0c36b;color:#1a0b2e}
.dl{display:grid;grid-template-columns:28px 1fr;gap:10px 8px;margin:14px 0}.dl b{display:block;font-size:11px;letter-spacing:2px;color:#c9a7f0;font-weight:600}.dl .pc{color:#a98cc8;font-style:italic}.dl .ic{font-size:18px}
</style></head><body><main>
<h1>TULUM 2027</h1><div class="sub">ZAMNA · 1 AL 11 DE ENERO</div>
<div class="g" id="g"></div><div class="bx"><h2>YA TENGO BOLETO</h2><div id="lg"></div><div id="ls"></div><button class="bt" id="sb">GUARDAR</button><div class="ok" id="ok"></div></div>
<div id="m"><div id="mc"></div></div><div class="f">nos vemos en la pista ✦</div></main>
<script>
// Para actualizar: edita esta lista. dia, nombre, hora, tag; opcionales: puertas, lugar, maps (link Google Maps), lineup, boletos (link). Vacío = "por confirmar"
const EVENTS=[
 {dia:6,nombre:"Black Coffee",hora:"22:00",tag:"",puertas:"22:00 (cierra 08:00)",lugar:"Zamna Cenote · Aldea Tulum (Km 200, Carr. 307)",maps:"https://www.google.com/maps/search/?api=1&query=5FPC%2BWW%20Tulum%2C%20Quintana%20Roo%2C%20Mexico",lineup:"Black Coffee + support por anunciar",boletos:"https://www.ticketfairy.com/event/black-coffee-tulum"},
 {dia:7,nombre:"Solomun",hora:"23:00",tag:"",puertas:"23:00 (cierra 08:00)",lugar:"Tehmplo Tulum (Zona Hotelera)",maps:"https://www.google.com/maps/search/?api=1&query=5G9V%2BQP%20Tulum%2C%20Quintana%20Roo",lineup:"Solomun + support por anunciar"},
 {dia:8,nombre:"Adriatique",hora:"22:00",tag:"por comprar",puertas:"22:00 (cierra 08:00)",lugar:"Zamna Cenote · Aldea Tulum (Km 200, Carr. 307)",maps:"https://www.google.com/maps/search/?api=1&query=5FPC%2BWW%20Tulum%2C%20Quintana%20Roo%2C%20Mexico",lineup:"Adriatique (X Tulum: FOREVER), Mind Against, Kotiēr, SAMA, WhoMadeWho (hybrid DJ set)",boletos:"https://www.ticketfairy.com/event/adriatique-present-x-tulum"},
 {dia:9,nombre:"Day Zero",hora:"19:00",tag:"",puertas:"18:00 (cierra 12:00)",lineup:"&ME, Damian Lazarus, Chloé Caillet, Culoe De Song, LP Giobbi, Mita Gami, RPR Soundsystem, Satori, Tiga, Victor Calderone, Vintage Culture, Jane Fitz, Mira, Robag Wruhme y más (30 artistas, 3 escenarios)"},
];

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const g=document.getElementById('g');
g.innerHTML=["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"].map(x=>`<div class="h">${x}</div>`).join('');
for(let d=new Date(2026,11,28);d<=new Date(2027,0,17);d.setDate(d.getDate()+1)){
 const on=d.getFullYear()==2027&&d.getDate()<=11, e=on&&EVENTS.find(x=>x.dia==d.getDate());
 g.insertAdjacentHTML('beforeend',`<div class="c${on?'':' off'}${e?' ev':''}"><div class="num">${d.getDate()}</div>${e?`<div class="n">${e.nombre}</div><div class="t">${e.hora}</div>${e.tag?`<div class="tag">${e.tag}</div>`:''}<div class="pp" data-r="${esc(e.nombre)}"></div>`:''}</div>`);
}
const FORM="https://docs.google.com/forms/d/e/1FAIpQLSeKYY-FbXa8yCJd-BdqAkL-8pVKShESfFKNSwZjI9W9QeIEtA/formResponse",CSV="https://docs.google.com/spreadsheets/d/1Qm1_7GKxEwq7m2AsFUIXZ1r5D0GTj-N1NK6t1_yw7mE/gviz/tq?tqx=out:csv";
let who={};
function det(i){const e=EVENTS[i],pc='<span class="pc">por confirmar</span>',row=(ic,l,v)=>`<div class="ic">${ic}</div><div><b>${l}</b>${v}</div>`,w=who[e.nombre]||[];document.getElementById('mc').innerHTML=`<h2 style="margin:0">${esc(e.nombre)}</h2><div class="dl">${row('📅','FECHA',`${e.dia} de enero 2027 · ${e.hora}`)}${row('🚪','PUERTAS',e.puertas?esc(e.puertas):pc)}${row('📍','LUGAR',e.lugar?(e.maps?`<a href="${esc(e.maps)}" target="_blank" rel="noopener">${esc(e.lugar)} ↗</a>`:esc(e.lugar)):pc)}${row('🎧','LINE UP',e.lineup?esc(e.lineup):pc)}${row('🎟','BOLETOS',e.boletos?`<a href="${esc(e.boletos)}" target="_blank" rel="noopener">Comprar boletos ↗</a>`:pc)}${row('✦','YA TIENEN BOLETO',w.length?esc(w.join(', ')):'<span class="pc">nadie todavía</span>')}</div><button class="bt" onclick="m.classList.remove('s')">CERRAR</button>`;m.classList.add('s')}
const m=document.getElementById('m');m.onclick=x=>{if(x.target==m)m.classList.remove('s')};
document.querySelectorAll('.c.ev').forEach(c=>{const i=EVENTS.findIndex(x=>x.dia==+c.querySelector('.num').textContent);c.onclick=()=>det(i)});
const PPL=["Yamir","Alan","Ana","Mauricio","Jessica","Julieta"],K='tulum-yo';let me=localStorage.getItem(K),mine={};if(!PPL.includes(me))me=null;
function login(){const g=document.getElementById('lg'),show=!!me;document.getElementById('ls').style.display=document.getElementById('sb').style.display=show?'':'none';
g.innerHTML=me?`<div class="me">Hola, ${me} ✦ <a href="#" id="cb">cambiar</a></div>`:`<p class="q">Soy…</p><div class="ch">${PPL.map(p=>`<button type="button" data-p="${p}">${p}</button>`).join('')}</div>`;
if(me)document.getElementById('cb').onclick=e=>{e.preventDefault();me=null;localStorage.removeItem(K);document.getElementById('ok').textContent='';login()};
else g.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{me=x.dataset.p;localStorage.setItem(K,me);login();list()})}
function dots(){document.querySelectorAll('.pp').forEach(x=>{const w=who[x.dataset.r]||[];x.innerHTML=w.map(n=>`<span title="${esc(n)}">${esc(n.slice(0,2))}</span>`).join('')})}
function picks(){const loc=JSON.parse(localStorage.getItem(K+'-'+me)||'null'),srv=mine[me];if(loc&&Date.now()-loc.t<6e5&&(!srv||srv.r.join()!=loc.r.join()))return loc.r;return srv?srv.r:[]}
function list(){const pk=me?picks():[];document.getElementById('ls').innerHTML=EVENTS.map((e,i)=>`<div class="r"><label><input type="checkbox" value="${esc(e.nombre)}"${pk.includes(e.nombre)?' checked':''}>${esc(e.nombre)} <small>${e.dia} ene</small><button class="d" type="button" onclick="event.preventDefault();det(${i})">ver ›</button></label>${(who[e.nombre]||[]).length?`<div class="w">✦ ${esc(who[e.nombre].join(', '))}</div>`:''}</div>`).join('')}
function csv(t){const R=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!='\r')f+=c}if(f||r.length){r.push(f);R.push(r)}return R}
function ts(v){const m=String(v).match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):(\d+)/);return m?Date.UTC(+m[3],m[2]-1,+m[1],+m[4],+m[5],+m[6]):0}
async function load(){try{const rows=csv(await (await fetch(CSV+'&t='+Date.now())).text()),h=rows.shift()||[],ni=h.indexOf('Nombre'),ri=h.indexOf('Raved'),ti=h.findIndex(x=>/marca|timestamp/i.test(x));mine={};
rows.forEach(r=>{const raw=(r[ni]||'').trim(),n=PPL.find(p=>p.toLowerCase()==raw.toLowerCase().split(/\s+/)[0]);if(n)mine[n]={t:ti>=0?ts(r[ti]):0,r:(r[ri]||'').split(',').map(x=>x.trim()).filter(Boolean)}});
}catch(e){}who={};const all=Object.assign({},mine);if(me)all[me]={r:picks()};PPL.forEach(n=>(all[n]?all[n].r:[]).forEach(x=>(who[x]=who[x]||[]).push(n)));list();dots()}
document.getElementById('sb').onclick=async()=>{const ok=document.getElementById('ok');if(!me)return;
const sel=[...document.querySelectorAll('#ls input:checked')].map(x=>x.value),b=new URLSearchParams({'entry.1141964805':me,'entry.266039925':sel.join(', ')});
ok.textContent='Guardando…';try{await fetch(FORM,{method:'POST',mode:'no-cors',body:b});localStorage.setItem(K+'-'+me,JSON.stringify({t:Date.now(),r:sel}));ok.textContent='¡Listo, '+me+'! Nos vemos en la pista ✦';load()}catch(e){ok.textContent='No se pudo guardar, intenta de nuevo'}};
login();
load();
</script></body></html>
